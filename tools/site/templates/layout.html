<!doctype html>
<html lang="{{lang}}" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){var d=document.documentElement;d.className="js";try{var t=localStorage.getItem("vdc-theme");if(t==="dark"||t==="light")d.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{alternates}}
<link rel="icon" href="{root}assets/logo.svg" type="image/svg+xml">
<link rel="icon" href="{root}assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{root}assets/icon-180.png">
<link rel="stylesheet" href="{root}assets/site.css">
<link rel="expect" href="#nav-early" blocking="render">
<script defer src="{root}assets/site.js" blocking="render"></script>
</head>
<body class="{{body_class}}" data-site="{{site_data}}">
<a class="skip" href="#content">{{skip}}</a>
<header class="topbar">
<div class="topbar-in">
<a class="btn btn-icon menu-btn" href="#site-nav" aria-label="{{menu}}" aria-controls="site-nav">{{icon_menu}}</a>
<a class="brand" href="index.html"><img src="{root}assets/mark.svg" alt="" width="28" height="28"><span class="brand-text"><span class="brand-name">{{site_name}}</span><span class="brand-docs">{{docs}}</span></span></a>
<nav class="top-links" aria-label="{{contents}}"><a href="index.html"{{guide_current}}>{{guide}}</a><a href="{{first_reference}}.html"{{reference_current}}>{{reference}}</a></nav>
<div class="search js-only" role="search">
<button type="button" class="btn btn-icon search-open" aria-label="{{search_placeholder}}">{{icon_search}}</button>
<div class="search-box">{{icon_search}}<input type="search" class="search-input" placeholder="{{search_placeholder}}" aria-label="{{search_placeholder}}" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list"><kbd class="search-key" aria-hidden="true">/</kbd><button type="button" class="btn btn-icon search-close" aria-label="{{search_clear}}">{{icon_close}}</button></div>
<div class="search-pop" hidden><ul id="search-list" role="listbox" aria-label="{{search_placeholder}}"></ul><p class="search-status" aria-live="polite"></p></div>
</div>
{{ask_button}}<div class="top-actions">{{lang_menu}}{{theme_menu}}<a class="btn btn-accent btn-sm top-dl" href="{{download_url}}" rel="noopener">{{icon_download}}<span>{{download}}</span></a></div>
</div>
</header>
<div class="layout">
<main id="content" class="doc" tabindex="-1"{{article_lang}}>
<article>
{{article}}
</article>
</main>
<aside class="aside-toc">{{toc}}</aside>
<nav id="site-nav" class="sidenav" aria-label="{{contents}}">
<div class="sidenav-head"><span class="sidenav-title">{{contents}}</span><a class="btn btn-icon nav-close" href="#content" aria-label="{{close_menu}}">{{icon_close}}</a></div>
<div class="sidenav-body">{{nav}}</div>
</nav>
<script id="nav-early">
/* Before the first paint (the head asks the browser to wait for this script): the sidebar comes back as the reader
   left it on the page before, its folded cards and its scroll position, and the highlight glides from the page they
   came from to this one, like the program's segmented selection. A reload, a link from elsewhere, the back button,
   the sheet on a narrow screen or a request for less motion get no glide; without the script the sidebar just shows. */
(function () {
  var d = document.documentElement, nav = document.getElementById('site-nav');
  if (!nav || !d.classList.contains('js') || !window.JSON) return;
  function get(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function path(u) { try { return new URL(u, location.href).pathname.replace(/index\.html$/, ''); } catch (e) { return ''; } }
  var cards = nav.querySelectorAll('.nav-card'), cur = nav.querySelector('.nav-card a[aria-current]'), i;
  var folds = get('vdc-folds');
  if (folds.length === cards.length) {
    for (i = 0; i < cards.length; i++) if (folds.charAt(i) === '0' && !(cur && cards[i].contains(cur))) cards[i].open = false;
  }
  var rec = null;
  try { rec = JSON.parse(get('vdc-nav') || 'null'); } catch (e) { rec = null; }
  if (!rec || !(Date.now() - rec.t < 30000)) return;
  var act = window.navigation && window.navigation.activation, ok = false;
  if (act) ok = (act.navigationType === 'push' || act.navigationType === 'replace') && !!act.from && path(act.from.url) === rec.from;
  else {
    var pn = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
    ok = !!pn && pn.type === 'navigate' && !!document.referrer && path(document.referrer) === rec.from;
  }
  if (!ok || (rec.to && path(rec.to) !== path(location.href))) return;
  if (getComputedStyle(nav).position !== 'sticky') return;
  nav.scrollTop = rec.scroll || 0;
  if (cur) {   // a link in the page may lead to an item the kept scroll hides: bring it just into view
    var nr = nav.getBoundingClientRect(), cr = cur.getBoundingClientRect(), low = Math.min(nr.bottom, innerHeight) - 8;
    if (cr.top < nr.top + 8) nav.scrollTop -= nr.top + 8 - cr.top;
    else if (cr.bottom > low) nav.scrollTop += cr.bottom - low;
  }
  if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || document.visibilityState !== 'visible' || !nav.animate) return;
  var EASE = 'cubic-bezier(.18,1,.56,1)', T = 280, starts = [];
  // Everything is laid out at its starting point here and set going together in the first frame: the curve puts most
  // of the travel in its first tenth of a second, and a clock started now would spend that part while the page is still
  // being painted (site.js runs before the first paint too, the head asks for it).
  function glide(box, root, a, b, shown, cls) {
    // The plate and both labels run on one clock: the labels' colours are animated from the look of the page left to
    // the look of this one, while their own hover fades rest (hl-setup) until the plate has landed. The weight changes
    // once, when the plate is half-way: a weight in between makes the browser look up a font face in every frame.
    root.classList.add('hl-setup', 'is-gliding');
    var els = [b, b.querySelector('.icon'), a, a.querySelector('.icon')];
    function look() {
      return els.map(function (el) { if (!el) return null; var s = getComputedStyle(el); return { color: s.color, fontWeight: s.fontWeight }; });
    }
    b.classList.add('hl-from');
    if (shown) a.classList.add('hl-was');
    var start = look();
    b.classList.remove('hl-from');
    a.classList.remove('hl-was');
    var end = look();
    var o = box.getBoundingClientRect(), r1 = b.getBoundingClientRect(), r0 = shown ? a.getBoundingClientRect() : r1;
    var pill = document.createElement('span'), ps = pill.style;
    pill.className = cls;
    pill.setAttribute('aria-hidden', 'true');
    function at(r) { return { left: (r.left - o.left) + 'px', top: (r.top - o.top) + 'px', width: r.width + 'px', height: r.height + 'px' }; }
    // left/top rather than a transform: the plate is then painted with the labels in the same frame, never ahead of them
    var k0 = at(r0), k1 = at(r1);
    for (var p in k0) ps[p] = k0[p];
    if (!shown) { ps.opacity = '0'; k0.opacity = 0; k1.opacity = 1; }
    box.appendChild(pill);
    var steps = [], holds = [];
    for (var k = 0; k < els.length; k++) {
      if (!els[k] || (start[k].color === end[k].color && start[k].fontWeight === end[k].fontWeight)) continue;
      var f = [{ color: start[k].color, fontWeight: start[k].fontWeight, offset: 0 }];
      if (start[k].fontWeight !== end[k].fontWeight) f.push({ fontWeight: start[k].fontWeight, offset: 0.5 }, { fontWeight: end[k].fontWeight, offset: 0.5 });
      f.push({ color: end[k].color, fontWeight: end[k].fontWeight, offset: 1 });
      steps.push([els[k], f]);
      holds.push(els[k].animate([start[k], start[k]], { fill: 'forwards' }));   // the starting look until the clock starts
    }
    starts.push(function () {
      var opt = { duration: T, easing: EASE };
      for (var n = 0; n < steps.length; n++) { holds[n].cancel(); steps[n][0].animate(steps[n][1], opt); }
      pill.animate([k0, k1], opt).onfinish = function () {
        root.classList.remove('is-gliding');
        void root.offsetWidth;
        pill.parentNode.removeChild(pill);
        root.classList.remove('hl-setup');
      };
      for (var p in k1) ps[p] = k1[p];
    });
  }
  var links = nav.querySelectorAll('.nav-card li a'), from = null;
  for (i = 0; i < links.length; i++) if (path(links[i].href) === rec.from) from = links[i];
  if (cur && from && from !== cur) {
    var card = from.closest('details');
    glide(nav.querySelector('.sidenav-body'), nav, from, cur, !card || card.open, 'nav-hl');
  }
  var dy = (rec.navTop || 0) - nav.getBoundingClientRect().top;
  if (Math.abs(dy) > 1 && !location.hash) {
    nav.style.transform = 'translateY(' + dy + 'px)';
    starts.push(function () { nav.style.transform = ''; nav.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: T, easing: EASE }); });
  }
  var bar = document.querySelector('.top-links');
  if (bar && rec.tab >= 0 && getComputedStyle(bar).display !== 'none') {
    var tabs = bar.querySelectorAll('a'), now = -1;
    for (i = 0; i < tabs.length; i++) if (tabs[i].hasAttribute('aria-current')) now = i;
    if (now >= 0 && now !== rec.tab && tabs[rec.tab]) glide(bar, bar, tabs[rec.tab], tabs[now], true, 'tab-hl');
  }
  if (starts.length) requestAnimationFrame(function () { for (var s = 0; s < starts.length; s++) starts[s](); });
})();
</script>
</div>
{{footer}}
</body>
</html>
