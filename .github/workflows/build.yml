name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Two editions from one source: the GeForce edition (default) and the Radeon edition (APP_EDITION_AMD).
      - name: Configure
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake -S . -B build-amd -A x64 -DCMAKE_BUILD_TYPE=Release -DAPP_EDITION_AMD=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel
          cmake --build build-amd --config Release --parallel

      # The DLSS 5 runtime builds are assets of the runtime-310.8 release (too large for the tree): fetched here and
      # checked against the published checksums before they go into the archive.
      - name: Fetch the DLSS 5 runtime builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download runtime-310.8 --repo ${{ github.repository }} --dir runtime --pattern "nvngx_dlssnr-310.8-*.dll" --pattern "SHA256SUMS.txt"
          $verified = 0
          foreach ($line in Get-Content runtime/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+\*?(\S+)$') { continue }
            $expected = $Matches[1].ToLower(); $name = $Matches[2]
            $actual = (Get-FileHash "runtime/$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "SHA-256 mismatch for ${name}: $actual, expected $expected" }
            Write-Host "$name verified ($actual)"
            $verified++
          }
          foreach ($build in "blackwell", "universal") {
            if (-not (Test-Path "runtime/nvngx_dlssnr-310.8-$build.dll")) { throw "runtime build missing: $build" }
          }
          if ($verified -lt 2) { throw "expected two verified runtime builds, got $verified" }

      - name: Package
        shell: pwsh
        run: |
          function Pack($build, $out) {
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Copy-Item "$build/Release/VRChatDLSS5Cam.exe" $out
            Copy-Item "$build/Release/onnxruntime.dll", "$build/Release/onnxruntime_providers_shared.dll", "$build/Release/DirectML.dll" $out
            Copy-Item -Recurse "$build/Release/models" "$out/models"
            Copy-Item -Recurse "$build/Release/licenses" "$out/licenses"
            Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $out
            Copy-Item "$build/ngx_sdk/NVIDIA_LICENSE.txt" $out
            Copy-Item -Recurse docs "$out/docs"
          }
          # GeForce edition: the DLAA runtime and both DLSS 5 runtime builds, no FidelityFX files.
          $out = "dist/VRChatDLSS5Cam"
          Pack "build" $out
          Copy-Item build/Release/nvngx_dlss.dll $out
          Remove-Item "$out/licenses/FidelityFX-SDK-LICENSE.txt"
          foreach ($rt in "blackwell", "universal") {
            New-Item -ItemType Directory -Force -Path "$out/runtimes/$rt" | Out-Null
            Copy-Item "runtime/nvngx_dlssnr-310.8-$rt.dll" "$out/runtimes/$rt/nvngx_dlssnr.dll"
          }
          Compress-Archive -Path "$out/*" -DestinationPath "dist/VRChatDLSS5Cam-win64.zip"
          # Linux package: the same GeForce edition plus the launcher scripts (docs/LINUX.md); Python writes the
          # tarball so that the scripts carry their executable bit.
          Copy-Item linux/vrchat-dlss5-cam, linux/install-linux.sh, "$out"
          Copy-Item resources/app-256.png "$out/icon.png"
          # The Direct3D shader compiler from the Windows SDK's redistributables: Proton's own d3dcompiler_47 miscompiles
          # the program's shaders (the picture's alpha comes out as zero), so the Linux package carries Microsoft's.
          $d3dc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Redist" -Recurse -Filter d3dcompiler_47.dll -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $d3dc) { throw "d3dcompiler_47.dll (x64) was not found under the Windows SDK's Redist folder" }
          Copy-Item $d3dc.FullName "$out/d3dcompiler_47.dll"
          Write-Host "Linux package: shader compiler from $($d3dc.FullName)"
          python -c "import tarfile, os
          root = 'dist/VRChatDLSS5Cam'
          with tarfile.open('dist/VRChatDLSS5Cam-linux-x86_64.tar.gz', 'w:gz') as tar:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort()
                  for name in sorted(filenames):
                      full = os.path.join(dirpath, name)
                      arc = 'VRChatDLSS5Cam/' + os.path.relpath(full, root).replace(os.sep, '/')
                      info = tar.gettarinfo(full, arc)
                      info.uid = info.gid = 0; info.uname = info.gname = ''
                      info.mode = 0o755 if name in ('vrchat-dlss5-cam', 'install-linux.sh') else 0o644
                      with open(full, 'rb') as f: tar.addfile(info, f)
          "
          Remove-Item "$out/vrchat-dlss5-cam", "$out/install-linux.sh", "$out/icon.png", "$out/d3dcompiler_47.dll"
          # Radeon edition: the FidelityFX API runtime for the FSR host route, and the RTX 50 build of the DLSS 5
          # runtime next to the executable, where the DLSS-NR-on-AMD installer looks for it.
          $amd = "dist-amd/VRChatDLSS5Cam"
          Pack "build-amd" $amd
          Copy-Item build-amd/Release/amd_fidelityfx_dx12.dll $amd
          Copy-Item runtime/nvngx_dlssnr-310.8-blackwell.dll "$amd/nvngx_dlssnr.dll"
          Compress-Archive -Path "$amd/*" -DestinationPath "dist-amd/VRChatDLSS5Cam-win64-amd.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRChatDLSS5Cam-win64
          path: |
            dist/VRChatDLSS5Cam
            !dist/VRChatDLSS5Cam/runtimes/**
          retention-days: 7

      - name: Upload artifact (Radeon edition)
        uses: actions/upload-artifact@v4
        with:
          name: VRChatDLSS5Cam-win64-amd
          path: |
            dist-amd/VRChatDLSS5Cam
            !dist-amd/VRChatDLSS5Cam/nvngx_dlssnr.dll
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Every version is published as a pre-release; it is promoted to the stable (Latest) release by hand once
          # several machines have confirmed it.
          prerelease: true
          body: |
            ### Which file to download / 下载哪个文件

            | Graphics card / 显卡 | File / 文件 |
            |---|---|
            | NVIDIA GeForce RTX 20 / 30 / 40 / 50 | `VRChatDLSS5Cam-win64.zip` |
            | AMD Radeon RX 7000 / 9000 | `VRChatDLSS5Cam-win64-amd.zip` (Radeon edition / Radeon 版) |
            | Linux with an NVIDIA card (runs under Proton) / Linux + NVIDIA 显卡（通过 Proton 运行） | `VRChatDLSS5Cam-linux-x86_64.tar.gz` (see `docs/LINUX.md` / 见 `docs/LINUX.md`) |

            The Radeon edition fetches DLSS-NR-on-AMD's installer for you at the first start; what to expect on Radeon is listed in the README under *AMD Radeon cards*.
            Radeon 版会在首次启动时为你下载 DLSS-NR-on-AMD 的安装器；Radeon 上的预期表现见 README 的 *AMD Radeon 显卡* 一节。

          generate_release_notes: true

      # The files go up with the GitHub CLI: the release action's own upload left large assets half-saved
      # ("Error saving asset") on a re-cut tag, and --clobber lets a re-run replace them.
      - name: Upload the release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/VRChatDLSS5Cam-win64.zip dist-amd/VRChatDLSS5Cam-win64-amd.zip dist/VRChatDLSS5Cam-linux-x86_64.tar.gz --clobber --repo "${{ github.repository }}"
